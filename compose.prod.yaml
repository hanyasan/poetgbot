x-prod: &prod
  build:
    target: prod
  image: poetgbot:latest
  restart: unless-stopped
  volumes: !override
    - storage:/app/storage
  environment:
    APP_ENV: production
    APP_DEBUG: "false"

services:
  app:
    <<: *prod
    command: sh -c "php artisan config:cache && php artisan route:cache && php artisan migrate --force && exec frankenphp run --config /etc/caddy/Caddyfile"
  scheduler:
    <<: *prod
    profiles: !reset []
    command: sh -c "php artisan config:cache && exec php artisan schedule:work"
  queue:
    <<: *prod
    command: sh -c "exec php artisan queue:work --queue=scheduled"
  # PhpStorm-only helper; must not run in prod (it would build the dev target and bind-mount the checkout).
  test:
    profiles: !override ["dev"]
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped

volumes:
  storage:
